<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinematic Crop · 电影画幅裁剪</title>
<!-- PWA:主屏幕图标 + 全屏 + 离线 -->
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电影裁剪">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #0d0d0d; color: #e8e8e8;
    display: flex; flex-direction: column;
    max-width: 520px; margin: 0 auto; min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- 顶栏 ---------- */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  }
  #topbar .tbtn {
    background: none; border: none; color: #cfcfcf; font-size: 16px;
    padding: 6px 4px; cursor: pointer; min-width: 48px;
  }
  #topbar .tbtn:disabled { color: #555; }
  #topbar .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #7fe3c8, #5fb4ee);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px #000;
  }
  .logo svg { width: 22px; height: 22px; }
  .biglogo svg { width: 60px; height: 60px; }

  /* ---------- 预览区 ---------- */
  #stage {
    flex: 1; min-height: 220px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #000;
    position: relative; overflow: hidden;
  }
  #emptyState { text-align: center; color: #666; cursor: pointer; padding: 40px 20px; }
  #emptyState .biglogo {
    width: 120px; height: 120px; margin: 0 auto 18px; border-radius: 26px;
    background: linear-gradient(135deg, #7fe3c8, #5fb4ee);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px #000;
  }
  #emptyState p { font-size: 14px; letter-spacing: 1px; }
  #canvasWrap { line-height: 0; max-width: 100%; display: none; }
  #canvasWrap.show { display: block; }
  #editCanvas { display: block; max-width: 100vw; touch-action: none; cursor: crosshair; }
  #pageInfo {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    color: #777; font-size: 12px; pointer-events: none;
  }

  /* ---------- 工具栏 ---------- */
  #toolbar {
    display: flex; justify-content: space-around; align-items: center;
    background: #1c1c1e; padding: 10px 8px;
  }
  #toolbar button {
    background: none; border: none; color: #bbb; cursor: pointer;
    width: 52px; height: 44px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #toolbar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #toolbar button.active { color: #66d9c0; background: #2c2c2e; }
  #toolbar button:disabled { color: #444; }

  /* ---------- 选项面板 ---------- */
  #options { background: #000; min-height: 108px; padding: 12px 10px; display: none; }
  #options.show { display: block; }

  .chips { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    flex-shrink: 0; width: 68px; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px; color: #999;
  }
  .chip .circle {
    width: 56px; height: 56px; border-radius: 50%; background: #2c2c2e;
    display: flex; align-items: center; justify-content: center;
  }
  .chip .shape { border: 1.5px solid #999; border-radius: 2px; }
  .chip .clabel { font-size: 11px; text-align: center; line-height: 1.3; }
  .chip.active .circle { background: #66d9c0; }
  .chip.active .shape { border-color: #141414; }
  .chip.active .clabel { color: #66d9c0; }

  .optrow { display: flex; align-items: center; gap: 12px; padding: 8px 6px; font-size: 14px; color: #ccc; }
  .optrow label { flex-shrink: 0; color: #999; font-size: 13px; }
  .optrow input[type=range] { flex: 1; accent-color: #66d9c0; }
  .optrow .val { color: #66d9c0; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 52px; text-align: right; }
  #barsReset {
    background: #2c2c2e; color: #bbb; border: none; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .optrow input[type=number] {
    background: #2c2c2e; color: #eee; border: 1px solid #3a3a3a;
    border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 110px;
  }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; cursor: pointer; }
  .switch input { display: none; }
  .switch .track { position: absolute; inset: 0; background: #3a3a3c; border-radius: 13px; transition: background .2s; }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + .track { background: #66d9c0; }
  .switch input:checked + .track::after { transform: translateX(20px); }

  .fchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchips button {
    background: #2c2c2e; color: #bbb; border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  .fchips button.on { background: #66d9c0; color: #141414; }

  /* ---------- 对话框(导出设置 / 自定义比例 / 比例管理) ---------- */
  #exportMask, #ratioMask, #manageMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #exportDialog, #ratioDialog, #manageDialog {
    background: #1c1c1e; border-radius: 14px; padding: 14px 16px;
    width: min(92vw, 380px); max-height: 86vh; overflow-y: auto;
  }
  #exportDialog .dtitle, #ratioDialog .dtitle, #manageDialog .dtitle { color: #eee; font-size: 16px; margin-bottom: 4px; }
  #exportDialog .dbtns, #ratioDialog .dbtns, #manageDialog .dbtns { display: flex; gap: 10px; margin-top: 14px; }
  #exportDialog .dbtns button, #ratioDialog .dbtns button, #manageDialog .dbtns button {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  #dlgCancel, #ratioCancel, #manageDefault { background: #2c2c2e; color: #ccc; }
  #dlgOk, #ratioOk, #manageDone { background: #66d9c0; color: #141414; }

  /* 比例管理面板行 */
  .mrow { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid #2c2c2e; }
  .mrow:last-child { border-bottom: none; }
  .mrow .mlabel { flex: 1; color: #ddd; font-size: 14px; }
  .mrow .mlabel .tag { color: #777; font-size: 11px; }
  .mrow button {
    background: #2c2c2e; color: #bbb; border: none; border-radius: 8px;
    width: 34px; height: 30px; font-size: 14px; cursor: pointer;
  }
  .mrow button:disabled { opacity: .3; }

  .bigbtns { display: flex; gap: 12px; padding: 8px 6px; }
  .bigbtns button {
    flex: 1; padding: 13px 0; border-radius: 10px; border: 1px solid #3a3a3a;
    background: #2c2c2e; color: #ddd; font-size: 15px; cursor: pointer;
  }
  .bigbtns button:active { background: #3c3c3e; }

  /* ---------- 重置 / 确认 ---------- */
  #confirmBar {
    display: none; justify-content: space-between; background: #000;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 10px);
  }
  #confirmBar.show { display: flex; }
  #confirmBar button {
    background: none; border: none; color: #ddd; font-size: 16px; cursor: pointer; padding: 6px 10px;
  }
  #confirmBar button:active { color: #66d9c0; }

  /* ---------- 照片选择条 ---------- */
  #pickerHead {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #000; color: #ddd; font-size: 14px; padding: 10px 0 6px; cursor: pointer;
    position: relative;
  }
  #pickerHead .cnt { color: #777; font-size: 12px; }
  #pickerHead .chev { font-size: 11px; color: #888; }
  #selectAllBtn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: #2c2c2e; color: #bbb; border: none; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  #selectAllBtn:active { color: #66d9c0; }
  #picker {
    display: flex; gap: 3px; overflow-x: auto; background: #000;
    padding: 0 3px calc(env(safe-area-inset-bottom) + 8px);
  }
  .thumb {
    position: relative; flex-shrink: 0; width: 88px; height: 88px;
    background: #1c1c1e; cursor: pointer; overflow: hidden;
  }
  .thumb canvas { width: 100%; height: 100%; display: block; }
  .thumb.current { box-shadow: inset 0 0 0 2px #fff; }
  .thumb .check {
    position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85);
    background: rgba(0,0,0,.35); color: transparent; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .thumb.selected { box-shadow: inset 0 0 0 2px #4a7dff; }
  .thumb.selected .check { background: #4a7dff; border-color: #4a7dff; color: #fff; }
  .thumb.addbtn {
    display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 30px; border: 1px dashed #3a3a3a;
  }
</style>
</head>
<body>

<!-- 顶栏:取消 / logo / 导出 -->
<div id="topbar">
  <button class="tbtn" id="cancelBtn">取消</button>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/></svg></div>
  <button class="tbtn" id="exportBtn" disabled>导出</button>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<!-- 预览区 -->
<div id="stage">
  <div id="emptyState">
    <div class="biglogo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/></svg></div>
    <p>请先选照片再编辑</p>
  </div>
  <div id="canvasWrap"><canvas id="editCanvas"></canvas></div>
  <div id="pageInfo"></div>
</div>

<!-- 五图标工具栏 -->
<div id="toolbar">
  <button data-tool="ratio" class="active" title="画幅比例">
    <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
  </button>
  <button data-tool="bars" title="黑边">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/></svg>
  </button>
  <button data-tool="rotate" title="旋转">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
  </button>
  <button data-tool="orient" title="横竖方向">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="1.5"/><rect x="17" y="3" width="5" height="18" rx="1.5"/></svg>
  </button>
  <button data-tool="output" title="输出尺寸">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
</div>

<!-- 选项面板 -->
<div id="options">
  <div id="opt-ratio" class="optpane"><div class="chips" id="ratioChips"></div></div>
  <div id="opt-bars" class="optpane" style="display:none">
    <div class="optrow">
      <label>对称黑边</label>
      <label class="switch"><input type="checkbox" id="barsCheck" checked><span class="track"></span></label>
    </div>
    <div class="optrow">
      <label>厚度</label>
      <input type="range" id="barsRange" min="0" max="15" step="0.1" value="4.5385">
      <span class="val" id="barsVal">4.54%</span>
      <button id="barsReset">重置</button>
    </div>
  </div>
  <div id="opt-rotate" class="optpane" style="display:none">
    <div class="bigbtns">
      <button id="rotL">⟲ 左转 90°</button>
      <button id="rotR">⟳ 右转 90°</button>
    </div>
  </div>
  <div id="opt-orient" class="optpane" style="display:none">
    <div class="bigbtns">
      <button id="btnLandscape">横版(上下黑边)</button>
      <button id="btnPortrait">竖版(左右黑边)</button>
    </div>
  </div>
  <div id="opt-output" class="optpane" style="display:none">
    <div class="optrow">
      <label>分辨率</label>
      <div class="fchips" id="resChips">
        <button data-res="0" class="on">原始</button>
        <button data-res="3840">4K</button>
        <button data-res="2560">2K</button>
        <button data-res="1920">1080P</button>
      </div>
    </div>
    <div class="optrow">
      <label>输出长边像素</label>
      <input type="number" id="outWidth" value="0" min="0" step="1">
      <span class="val">0 = 原尺寸</span>
    </div>
    <div class="optrow">
      <label>格式</label>
      <div class="fchips" id="fmtChips">
        <button data-fmt="jpeg" class="on">JPG</button>
        <button data-fmt="png">PNG 无损</button>
        <button data-fmt="webp">WebP</button>
      </div>
    </div>
    <div class="optrow" id="qualityRow">
      <label>压缩质量</label>
      <input type="range" id="qualityRange" min="50" max="100" step="1" value="92">
      <span class="val" id="qualityVal">92%</span>
    </div>
  </div>
</div>

<!-- 导出设置对话框 -->
<div id="exportMask">
  <div id="exportDialog">
    <div class="dtitle">导出设置</div>
    <div class="optrow">
      <label>分辨率</label>
      <div class="fchips" id="dlgResChips">
        <button data-res="0">原始</button>
        <button data-res="3840">4K</button>
        <button data-res="2560">2K</button>
        <button data-res="1920">1080P</button>
      </div>
    </div>
    <div class="optrow">
      <label>格式</label>
      <div class="fchips" id="dlgFmtChips">
        <button data-fmt="jpeg">JPG</button>
        <button data-fmt="png">PNG 无损</button>
        <button data-fmt="webp">WebP</button>
      </div>
    </div>
    <div class="optrow" id="dlgQualityRow">
      <label>压缩质量</label>
      <input type="range" id="dlgQuality" min="50" max="100" step="1" value="92">
      <span class="val" id="dlgQualityVal">92%</span>
    </div>
    <div class="dbtns">
      <button id="dlgCancel">取消</button>
      <button id="dlgOk">开始导出</button>
    </div>
  </div>
</div>

<!-- 自定义比例对话框:宽 / 高 两个输入框 -->
<div id="ratioMask">
  <div id="ratioDialog">
    <div class="dtitle">添加自定义比例</div>
    <div class="optrow">
      <label>宽</label>
      <input type="number" id="ratioW" min="0" step="any" placeholder="21" style="width:90px">
      <span style="color:#777">:</span>
      <label>高</label>
      <input type="number" id="ratioH" min="0" step="any" placeholder="9" style="width:90px">

      <button id="ratioCancel">取消</button>
      <button id="ratioOk">添加</button>

</div>

<!-- 比例管理面板:排序 / 删除 / 恢复默认 -->
<div id="manageMask">
  <div id="manageDialog">
    <div class="dtitle">管理裁剪比例</div>
    <div id="manageList"></div>
    <div class="dbtns">
      <button id="manageDefault">恢复默认</button>
      <button id="manageDone">完成</button>
    </div>
  </div>
</div>

  <button id="resetBtn">重置</button>
  <button id="applyAllBtn">应用到全部</button>

<!-- 照片选择 -->
<div id="pickerHead"><span id="pickerTitle">全部照片</span><span class="cnt" id="pickerCnt"></span><span class="chev">∨</span><button id="selectAllBtn">全选</button></div>
<div id="picker"><div class="thumb addbtn" id="addBtn">+</div></div>

<script>
"use strict";

const CINEMATIC = 2.7087;
const BAR_PCT_DEFAULT = 4.5385;

const $ = id => document.getElementById(id);
const fileInput = $("fileInput");
const editCanvas = $("editCanvas"), canvasWrap = $("canvasWrap");
const stage = $("stage"), picker = $("picker");

const RATIOS = [
  { v: "orig",      label: "原始" },
  { v: "cinematic", label: "电影画幅", sub: "2.71:1" },
  { v: "2.39",      label: "2.39:1", sub: "宽银幕" },
  { v: "1.7778",    label: "16:9" },
  { v: "1",         label: "1:1", sub: "正方形" },
  { v: "1.3333",    label: "4:3" },
  { v: "0.75",      label: "3:4" },
  { v: "0.5625",    label: "9:16", sub: "IG 快拍" },
  { v: "free",      label: "自由" },
];

// ---------- 状态 ----------
const photos = [];          // {id,url,img,name,crop,orient}
let photoSeq = 0;
let current = -1;
const selected = new Set(); // photo id

// 全局输出设置
let ratioVal = "cinematic";
let barsOn = true, barsPct = BAR_PCT_DEFAULT, outLong = 0;
let outFormat = "jpeg", outQuality = 0.92;

// 编辑画布状态
let drag = null;
let dpr = window.devicePixelRatio || 1;
let viewScale = 1;
let baseCanvas = null, editCtx = null, rafPending = false;

const cur = () => (current >= 0 && current < photos.length) ? photos[current] : null;

// ---------- 文件载入(多选) ----------
fileInput.addEventListener("change", () => { addFiles([...fileInput.files]); fileInput.value = ""; });
$("addBtn").addEventListener("click", () => fileInput.click());
$("pickerHead").addEventListener("click", () => fileInput.click());
$("emptyState").addEventListener("click", () => fileInput.click());

function addFiles(files) {
  const imgs = files.filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return;
  let firstNew = -1;
  for (const file of imgs) {
    const p = {
      id: photoSeq++, url: URL.createObjectURL(file),
      img: null, name: file.name.replace(/\.[^.]+$/, ""),
      crop: null, orient: null,
    };
    const image = new Image();
    image.onload = () => {
      p.img = image;
      p.orient = image.naturalWidth >= image.naturalHeight ? "landscape" : "portrait";
      drawThumb(p);
      if (firstNew < 0) { firstNew = photos.indexOf(p); selectPhoto(firstNew); }
      refreshPicker();
    };
    image.src = p.url;
    photos.push(p);
    addThumb(p);
  }
}

// ---------- 底部照片条 ----------
function addThumb(p) {
  const el = document.createElement("div");
  el.className = "thumb"; el.dataset.pid = p.id;
  const cv = document.createElement("canvas");
  cv.width = 176; cv.height = 176;
  el.appendChild(cv);
  const chk = document.createElement("button");
  chk.className = "check"; chk.textContent = "✓";
  el.appendChild(chk);
  cv.addEventListener("click", () => selectPhoto(photos.indexOf(p)));
  chk.addEventListener("click", e => {
    e.stopPropagation();
    selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id);
    refreshPicker();
  });
  el.addEventListener("click", () => selectPhoto(photos.indexOf(p)));
  picker.insertBefore(el, $("addBtn"));
  if (p.img) drawThumb(p);
}

// 缩略图:cover 绘制图片,并叠加该图当前的裁剪范围(范围外压暗 + 黄框)
function drawThumb(p) {
  const el = picker.querySelector(`.thumb[data-pid="${p.id}"]`);
  if (!el || !p.img) return;
  const cv = el.querySelector("canvas"), ctx = cv.getContext("2d");
  const S = cv.width, iw = p.img.naturalWidth, ih = p.img.naturalHeight;
  const scale = Math.max(S / iw, S / ih);
  const dw = iw * scale, dh = ih * scale;
  const ox = (S - dw) / 2, oy = (S - dh) / 2;
  ctx.clearRect(0, 0, S, S);
  ctx.drawImage(p.img, ox, oy, dw, dh);
  if (!p.crop) return;
  const rx = Math.max(0, p.crop.x * scale + ox), ry = Math.max(0, p.crop.y * scale + oy);
  const rx2 = Math.min(S, (p.crop.x + p.crop.w) * scale + ox);
  const ry2 = Math.min(S, (p.crop.y + p.crop.h) * scale + oy);
  const rw = rx2 - rx, rh = ry2 - ry;
  if (rw <= 0 || rh <= 0) return;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, S, ry);
  ctx.fillRect(0, ry2, S, S - ry2);
  ctx.fillRect(0, ry, rx, rh);
  ctx.fillRect(rx2, ry, S - rx2, rh);
  ctx.strokeStyle = "#66d9c0"; ctx.lineWidth = 2;
  ctx.strokeRect(rx + 1, ry + 1, rw - 2, rh - 2);
}

function refreshPicker() {

// ---------- 比例 ----------
function chipShapeStyle(v) {
  // 圆形按钮里的小形状,按宽高比画
  let w = 26, h = 26;
  const r = v === "orig" || v === "free" ? 1 : (v === "cinematic" ? CINEMATIC : parseFloat(v));
  if (v === "orig") return "width:22px;height:22px;border-style:dashed";
  if (v === "free") return "width:22px;height:16px;transform:rotate(-12deg)";
  if (r >= 1) h = Math.max(8, w / r); else w = Math.max(8, h * r);
  return `width:${w}px;height:${h}px`;
}

// ---------- 比例布局:自定义 + 排序/删除/恢复默认(localStorage 持久化) ----------
function defaultRatioLayout() { return RATIOS.map(r => ({ v: r.v })); }

// ratioLayout: [{v, label?, custom?}],内置项只有 v(查 RATIOS 取 label),自定义项带 label
let ratioLayout = (() => {
  try {
    const s = JSON.parse(localStorage.getItem("ratioLayout") || "null");
    if (Array.isArray(s) && s.length) return s;
  } catch (e) {}
  // 迁移旧版 customRatios
  let old = [];
  try { old = JSON.parse(localStorage.getItem("customRatios") || "[]"); } catch (e) {}
  return defaultRatioLayout().concat(old.map(c => ({ v: c.v, label: c.label, custom: true })));
})();

function saveRatioLayout() {
  localStorage.setItem("ratioLayout", JSON.stringify(ratioLayout));
}

function ratioDefFor(e) {
  return RATIOS.find(r => r.v === e.v) || { v: e.v, label: e.label || e.v, custom: true };
}

// 当前选中的比例被删后,回退到电影画幅(或列表第一项)
function ensureRatioVal() {
  if (ratioLayout.some(e => e.v === ratioVal)) return;
  ratioVal = ratioLayout.some(e => e.v === "cinematic") ? "cinematic" : ratioLayout[0].v;
  if (cur()) { resetCrop(); render(); }
}

function buildChips() {
  const box = $("ratioChips");
  box.innerHTML = "";
  for (const e of ratioLayout) {
    const r = ratioDefFor(e);
    const b = document.createElement("button");
    b.className = "chip" + (r.v === ratioVal ? " active" : "");
    b.dataset.v = r.v;
    b.innerHTML = `<span class="circle"><span class="shape" style="${chipShapeStyle(r.v)}"></span></span>` +
      `<span class="clabel">${r.label}${r.sub ? "<br>" + r.sub : ""}</span>`;
    let longFired = false;
    b.addEventListener("click", () => {
      if (longFired) { longFired = false; return; } // 长按删除后不触发选中
      ratioVal = r.v;
      box.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.v === r.v));
      if (cur()) { resetCrop(); render(); }
    });
    if (r.custom) {
      // 长按 600ms 删除自定义比例(管理面板里也可删除)
      let timer = null;
      b.addEventListener("pointerdown", () => {
        longFired = false;
        timer = setTimeout(() => {
          timer = null; longFired = true;
          if (confirm(`删除自定义比例 ${r.label}?`)) {
            ratioLayout = ratioLayout.filter(x => x !== e);
            saveRatioLayout();
            ensureRatioVal();
            buildChips();
          }
        }, 600);
      });
      const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
      b.addEventListener("pointerup", cancel);
      b.addEventListener("pointerleave", cancel);
      b.addEventListener("contextmenu", ev => ev.preventDefault());
    }
    box.appendChild(b);
  }
  // 末尾「+」:添加自定义比例(宽 / 高 两个输入框)
  const add = document.createElement("button");
  add.className = "chip";
  add.innerHTML = `<span class="circle"><span class="shape" style="border:none;font-size:24px;line-height:1;color:#999">+</span></span>` +
    `<span class="clabel">自定义<br>&nbsp;</span>`;
  add.addEventListener("click", () => {
    $("ratioW").value = ""; $("ratioH").value = "";
    $("ratioMask").style.display = "flex";
  });
  box.appendChild(add);
  // 末尾「管理」:排序 / 删除 / 恢复默认
  const mg = document.createElement("button");
  mg.className = "chip";
  mg.innerHTML = `<span class="circle"><span class="shape" style="border:none;font-size:18px;line-height:1;color:#999">☰</span></span>` +
    `<span class="clabel">管理<br>&nbsp;</span>`;
  mg.addEventListener("click", () => {
    renderManageList();
    $("manageMask").style.display = "flex";
  });
  box.appendChild(mg);
}
buildChips();

// ---------- 比例管理面板:↑↓ 排序、× 删除、恢复默认 ----------
function renderManageList() {
  const box = $("manageList");
  box.innerHTML = "";
  ratioLayout.forEach((e, i) => {
    const def = ratioDefFor(e);
    const row = document.createElement("div");
    row.className = "mrow";
    const label = document.createElement("span");
    label.className = "mlabel";
    label.innerHTML = def.label +
      (def.sub ? ` <span class="tag">${def.sub}</span>` : "") +
      (def.custom ? ` <span class="tag">自定义</span>` : "");
    row.appendChild(label);
    const mk = (txt, fn, dis) => {
      const btn = document.createElement("button");
      btn.textContent = txt; btn.disabled = !!dis;
      btn.addEventListener("click", fn);
      row.appendChild(btn);
    };
    mk("↑", () => {
      [ratioLayout[i - 1], ratioLayout[i]] = [ratioLayout[i], ratioLayout[i - 1]];
      saveRatioLayout(); buildChips(); renderManageList();
    }, i === 0);
    mk("↓", () => {
      [ratioLayout[i + 1], ratioLayout[i]] = [ratioLayout[i], ratioLayout[i + 1]];
      saveRatioLayout(); buildChips(); renderManageList();
    }, i === ratioLayout.length - 1);
    mk("×", () => {
      ratioLayout.splice(i, 1);
      saveRatioLayout(); ensureRatioVal(); buildChips(); renderManageList();
    });
    box.appendChild(row);
  });
}
$("manageDone").addEventListener("click", () => { $("manageMask").style.display = "none"; });
// 恢复默认:内置比例回到默认顺序,自定义比例保留并排在末尾
$("manageDefault").addEventListener("click", () => {
  const customs = ratioLayout.filter(e => ratioDefFor(e).custom);
  ratioLayout = defaultRatioLayout().concat(customs);
  saveRatioLayout(); ensureRatioVal(); buildChips(); renderManageList();
});

$("ratioCancel").addEventListener("click", () => { $("ratioMask").style.display = "none"; });
$("ratioOk").addEventListener("click", () => {
  const w = parseFloat($("ratioW").value), h = parseFloat($("ratioH").value);
  if (!(w > 0) || !(h > 0) || w / h > 100) { alert("请输入正确的宽和高,如 21 和 9"); return; }
  const v = w / h;
  const label = $("ratioW").value.trim() + ":" + $("ratioH").value.trim();
  const parsed = { v: String(+v.toFixed(4)), label, custom: true };
  if (ratioLayout.some(e => e.v === parsed.v)) { alert("该比例已存在"); return; }
  $("ratioMask").style.display = "none";
  ratioLayout.push(parsed);
  saveRatioLayout();
  ratioVal = parsed.v;
  buildChips();
  if (cur()) { resetCrop(); render(); }
});

function currentRatio(p) {
  if (ratioVal === "free") return null;
  if (ratioVal === "orig") return p.img.naturalWidth / p.img.naturalHeight;
  let r = ratioVal === "cinematic" ? CINEMATIC : parseFloat(ratioVal);
  // 横版=宽:高;竖版=高:宽的倒数。原始比例不翻转
  return p.orient === "portrait" ? 1 / r : r;
}

function resetCrop() {
  const p = cur(); if (!p) return;
  const W = p.img.naturalWidth, H = p.img.naturalHeight;
  const r = currentRatio(p) || W / H;
  let w, h;
  if (W / H > r) { h = H; w = H * r; } else { w = W; h = W / r; }
  p.crop = { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

// ---------- 画布 ----------
function fitCanvas() {
  const p = cur(); if (!p || !p.img) return;
  const maxW = stage.clientWidth, maxH = Math.max(stage.clientHeight - 20, 160);
  const iw = p.img.naturalWidth, ih = p.img.naturalHeight;
  viewScale = Math.min(maxW / iw, maxH / ih);
  const cssW = iw * viewScale, cssH = ih * viewScale;
  editCanvas.style.width = cssW + "px";
  editCanvas.style.height = cssH + "px";
  editCanvas.width = Math.round(cssW * dpr);
  editCanvas.height = Math.round(cssH * dpr);
  editCtx = editCanvas.getContext("2d");
  buildBase();
  render();
}
window.addEventListener("resize", fitCanvas);

function buildBase() {
  if (!baseCanvas) baseCanvas = document.createElement("canvas");
  baseCanvas.width = editCanvas.width;
  baseCanvas.height = editCanvas.height;
  const bctx = baseCanvas.getContext("2d");
  bctx.imageSmoothingQuality = "high";
  bctx.drawImage(cur().img, 0, 0, baseCanvas.width, baseCanvas.height);
}

function render() {
  const p = cur(); if (!p || !p.crop || !editCtx) return;
  const crop = p.crop, ctx = editCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(baseCanvas, 0, 0);
  ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);

  const W = p.img.naturalWidth, H = p.img.naturalHeight;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, crop.y);
  ctx.fillRect(0, crop.y + crop.h, W, H - crop.y - crop.h);
  ctx.fillRect(0, crop.y, crop.x, crop.h);
  ctx.fillRect(crop.x + crop.w, crop.y, W - crop.x - crop.w, crop.h);

  // 对称黑边实时预览:成品 = 内容 + 短边两侧的黑边(与导出合成一致)
  if (barsOn && barsPct > 0) {
    const bar = Math.max(crop.w, crop.h) * barsPct / 100;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); // 黑边不画出图像范围
    ctx.fillStyle = "#000";
    if (crop.w >= crop.h) {
      ctx.fillRect(crop.x, crop.y - bar, crop.w, bar);
      ctx.fillRect(crop.x, crop.y + crop.h, crop.w, bar);
    } else {
      ctx.fillRect(crop.x - bar, crop.y, bar, crop.h);
      ctx.fillRect(crop.x + crop.w, crop.y, bar, crop.h);
    }
    ctx.restore();
  }

  const lw = 1.5 / viewScale;
  ctx.strokeStyle = "#66d9c0"; ctx.lineWidth = lw;
  ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = lw * 0.7;
  ctx.beginPath();
  for (let i = 1; i <= 2; i++) {
    ctx.moveTo(crop.x + crop.w * i / 3, crop.y);
    ctx.lineTo(crop.x + crop.w * i / 3, crop.y + crop.h);
    ctx.moveTo(crop.x, crop.y + crop.h * i / 3);
    ctx.lineTo(crop.x + crop.w, crop.y + crop.h * i / 3);
  }
  ctx.stroke();

  const hs = 5 / viewScale;
  ctx.fillStyle = "#66d9c0";
  for (const pt of handlePoints()) ctx.fillRect(pt.x - hs, pt.y - hs, hs * 2, hs * 2);

  drawThumb(p); // 缩略图同步显示最新裁剪范围
}

function scheduleDragRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}

function handlePoints() {
  const { x, y, w, h } = cur().crop;
  return [
    { id: "nw", x, y }, { id: "n", x: x + w / 2, y }, { id: "ne", x: x + w, y },
    { id: "e", x: x + w, y: y + h / 2 },
    { id: "se", x: x + w, y: y + h }, { id: "s", x: x + w / 2, y: y + h },
    { id: "sw", x, y: y + h }, { id: "w", x, y: y + h / 2 },
  ];
}

// ---------- 裁剪交互 ----------
function evtPos(e) {
  const r = editCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / viewScale, y: (e.clientY - r.top) / viewScale };
}

editCanvas.addEventListener("pointerdown", e => {
  const p = cur(); if (!p || !p.crop) return;
  const crop = p.crop, pos = evtPos(e);
  const tol = 14 / viewScale;
  let hit = null;
  for (const h of handlePoints())
    if (Math.abs(pos.x - h.x) < tol && Math.abs(pos.y - h.y) < tol) { hit = h.id; break; }
  if (hit) {
    drag = { mode: "resize", handle: hit, orig: { ...crop } };
  } else if (pos.x > crop.x && pos.x < crop.x + crop.w && pos.y > crop.y && pos.y < crop.y + crop.h) {
    drag = { mode: "move", startX: pos.x, startY: pos.y, orig: { ...crop } };
  } else return;
  editCanvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

editCanvas.addEventListener("pointermove", e => {
  const p = cur(); if (!drag || !p) return;
  const crop = p.crop, pos = evtPos(e);
  const W = p.img.naturalWidth, H = p.img.naturalHeight;
  const r = currentRatio(p);

  if (drag.mode === "move") {
    crop.x = Math.min(Math.max(drag.orig.x + pos.x - drag.startX, 0), W - crop.w);
    crop.y = Math.min(Math.max(drag.orig.y + pos.y - drag.startY, 0), H - crop.h);
  } else {
    resizeCrop(p, drag.handle, pos, r, W, H);
  }
  scheduleDragRender();
});

editCanvas.addEventListener("pointerup", () => { drag = null; render(); });
editCanvas.addEventListener("pointercancel", () => { drag = null; render(); });

function resizeCrop(p, handle, pos, ratio, W, H) {
  const o = drag.orig, crop = p.crop, minSize = 30;

  if (!ratio) {
    let { x, y, w, h } = o;
    if (handle.includes("e")) w = pos.x - o.x;
    if (handle.includes("w")) { x = pos.x; w = o.x + o.w - pos.x; }
    if (handle.includes("s")) h = pos.y - o.y;
    if (handle.includes("n")) { y = pos.y; h = o.y + o.h - pos.y; }
    if (w >= minSize) { crop.x = Math.max(0, x); crop.w = Math.min(w, W - crop.x); }
    if (h >= minSize) { crop.y = Math.max(0, y); crop.h = Math.min(h, H - crop.y); }
    return;
  }

  const anchors = {
    nw: { ax: o.x + o.w, ay: o.y + o.h }, se: { ax: o.x, ay: o.y },
    ne: { ax: o.x, ay: o.y + o.h }, sw: { ax: o.x + o.w, ay: o.y },
    n: { ax: o.x + o.w / 2, ay: o.y + o.h }, s: { ax: o.x + o.w / 2, ay: o.y },
    e: { ax: o.x, ay: o.y + o.h / 2 }, w: { ax: o.x + o.w, ay: o.y + o.h / 2 },
  };
  const { ax, ay } = anchors[handle];
  const edge = handle.length === 1;

  let w, h;
  if (edge && (handle === "n" || handle === "s")) {
    h = Math.abs(pos.y - ay); w = h * ratio;
  } else if (edge) {
    w = Math.abs(pos.x - ax); h = w / ratio;
  } else {
    const w1 = Math.abs(pos.x - ax), h1 = Math.abs(pos.y - ay);
    if (w1 / ratio > h1) { w = w1; h = w / ratio; } else { h = h1; w = h * ratio; }
  }
  w = Math.max(w, minSize); h = Math.max(h, minSize);

  let nx = ax - (handle.includes("e") ? 0 : edge ? w / 2 : w);
  let ny = ay - (handle.includes("s") ? 0 : edge && (handle === "e" || handle === "w") ? h / 2 : h);
  if (nx < 0 || ny < 0 || nx + w > W || ny + h > H) {
    const k = Math.min(1,
      nx < 0 ? ax / w : 1,
      ny < 0 ? ay / h : 1,
      nx + w > W ? (W - ax) / (nx + w - ax) : 1,
      ny + h > H ? (H - ay) / (ny + h - ay) : 1);
    w *= k; h = w / ratio;
    nx = ax - (handle.includes("e") ? 0 : edge ? w / 2 : w);
    ny = ay - (handle.includes("s") ? 0 : edge && (handle === "e" || handle === "w") ? h / 2 : h);
  }
  p.crop = { x: Math.max(0, nx), y: Math.max(0, ny), w: Math.min(w, W), h: Math.min(h, H) };
}

function rotateCurrent(deg) {
  const p = cur(); if (!p || !p.img) return;
  const src = p.img, W = src.naturalWidth, H = src.naturalHeight;
  const c = document.createElement("canvas");
  c.width = H; c.height = W;
  const x = c.getContext("2d");
  x.translate(H / 2, W / 2);
  x.rotate(deg * Math.PI / 180);
  x.drawImage(src, -W / 2, -H / 2);
  const img = new Image();
  img.onload = () => {
    p.img = img; p.orient = W >= H ? "portrait" : "landscape";
    p.crop = null; resetCrop(); fitCanvas();
  };
  img.src = c.toDataURL("image/png");
}

// 应用到全部:把当前照片的裁剪框(归一化)与横竖方向套用到所有照片
$("applyAllBtn").addEventListener("click", () => {
  const p = cur(); if (!p || !p.crop) return;
  const W = p.img.naturalWidth, H = p.img.naturalHeight;
  const n = { x: p.crop.x / W, y: p.crop.y / H, w: p.crop.w / W, h: p.crop.h / H };
  for (const q of photos) {
    if (q === p || !q.img) continue;
    const qw = q.img.naturalWidth, qh = q.img.naturalHeight;
    q.crop = { x: n.x * qw, y: n.y * qh, w: n.w * qw, h: n.h * qh };
    q.orient = p.orient;
    drawThumb(q);
  }
  $("applyAllBtn").textContent = "已应用 ✓";
  setTimeout(() => { $("applyAllBtn").textContent = "应用到全部"; }, 1200);
});

$("cancelBtn").addEventListener("click", () => {
  if (!photos.length) return;
  if (!confirm("清空所有已导入的照片?")) return;
  for (const p of photos) URL.revokeObjectURL(p.url);
  photos.length = 0; selected.clear(); current = -1;
  picker.querySelectorAll(".thumb[data-pid]").forEach(el => el.remove());
  $("emptyState").style.display = "";
  canvasWrap.classList.remove("show");
  $("options").classList.remove("show");
  $("confirmBar").classList.remove("show");
  refreshPicker();
});

// ---------- 输出渲染 ----------
function renderOutput(p) {
  if (!p.crop) {
    // 未编辑过的照片用默认居中裁剪
    const W = p.img.naturalWidth, H = p.img.naturalHeight;
    const r = currentRatio(p) || W / H;
    let w, h;
    if (W / H > r) { h = H; w = H * r; } else { w = W; h = W / r; }
    p.crop = { x: (W - w) / 2, y: (H - h) / 2, w, h };
  }
  const crop = p.crop, r = currentRatio(p);
  let cw = crop.w, ch = crop.h;
  if (r) { ch = cw / r; if (ch > crop.h) { ch = crop.h; cw = ch * r; } }

  const longSide = Math.max(cw, ch);
  const k = outLong > 0 && longSide > outLong ? outLong / longSide : 1;
  const outW = Math.round(cw * k), outH = Math.round(ch * k);

  const bar = barsOn ? Math.round(Math.max(outW, outH) * barsPct / 100) : 0;
  const horiz = outW >= outH;
  const finalW = horiz ? outW : outW + bar * 2;
  const finalH = horiz ? outH + bar * 2 : outH;

  const c = document.createElement("canvas");
  c.width = finalW; c.height = finalH;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, finalW, finalH);
  ctx.imageSmoothingQuality = "high";
  const dx = horiz ? 0 : bar, dy = horiz ? bar : 0;
  ctx.drawImage(p.img, crop.x, crop.y, crop.w, crop.h, dx, dy, outW, outH);
  return c;
}

function saveCanvas(c, fileName) {
  // PNG 为无损,toBlob 的 quality 参数只对 JPG/WebP 生效
  c.toBlob(blob => {
    if (window.AndroidBridge && typeof window.AndroidBridge.savePng === "function") {
      const reader = new FileReader();
      reader.onload = () => AndroidBridge.savePng(reader.result, fileName);
      reader.readAsDataURL(blob);
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, "image/" + outFormat, outFormat === "png" ? undefined : outQuality);
}

// ---------- ZIP 打包(STORE 无压缩;PNG/JPG 本身已压缩,单文件零依赖) ----------
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// entries: [{name, data:Uint8Array}] → zip Blob
function buildZip(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);  // local file header
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);      // UTF-8 文件名
    lh.setUint16(8, 0, true);           // STORE
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, e.data.length, true);
    lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, name.length, true);
    parts.push(lh.buffer, name, e.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);  // central directory
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, e.data.length, true);
    ch.setUint32(24, e.data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + e.data.length;
  }
  const centralSize = central.reduce((s, p) => s + p.byteLength, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);    // end of central directory
  eo.setUint16(8, entries.length, true);
  eo.setUint16(10, entries.length, true);
  eo.setUint32(12, centralSize, true);
  eo.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eo.buffer], { type: "application/zip" });
}

function downloadBlob(blob, fileName) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// 导出:先弹出导出设置对话框,确认后导出已勾选的全部;未勾选任何时导出当前这张
function exportList() {
  return selected.size
    ? photos.filter(p => selected.has(p.id) && p.img)
    : (cur() ? [cur()] : []);
}

$("exportBtn").addEventListener("click", () => {
  if (!exportList().length) return;
  syncResChips(); syncFmtChips();
  $("exportMask").style.display = "flex";
});
$("dlgCancel").addEventListener("click", () => { $("exportMask").style.display = "none"; });
$("dlgOk").addEventListener("click", async () => {
  $("exportMask").style.display = "none";
  const list = exportList();
  if (!list.length) return;
  $("exportBtn").disabled = true;
  const ext = outFormat === "jpeg" ? "jpg" : outFormat;
  const suffix = p => p.orient === "portrait" ? "_cinematic_portrait" : "_cinematic";

  if (list.length === 1) {
    // 单张:直接下载原格式
    const p = list[0];
    saveCanvas(renderOutput(p), `${p.name}${suffix(p)}.${ext}`);
  } else {
    // 多张:打包成一个 zip 一次性下载,避免浏览器逐张拦截
    $("exportBtn").textContent = "打包中…";
    const toBuffer = c => new Promise(res =>
      c.toBlob(b => b.arrayBuffer().then(ab => res(new Uint8Array(ab))),
        "image/" + outFormat, outFormat === "png" ? undefined : outQuality));
    const entries = [], seen = new Set();
    for (const p of list) {
      let name = `${p.name}${suffix(p)}.${ext}`;
      for (let n = 2; seen.has(name); n++) name = `${p.name}${suffix(p)}_${n}.${ext}`; // 重名去重
      seen.add(name);
      entries.push({ name, data: await toBuffer(renderOutput(p)) });
    }
    const t = new Date(), pad = n => String(n).padStart(2, "0");
    downloadBlob(buildZip(entries),
      `电影画幅裁剪_${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}.zip`);
  }
  $("exportBtn").textContent = "导出";
  $("exportBtn").disabled = false;
});

$("barsVal").textContent = BAR_PCT_DEFAULT.toFixed(2) + "%";

// PWA:注册离线缓存(失败不影响正常使用)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
